            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassSessionScheduleResponse"
          description: No sessions found for this recurrence ID
        "422":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassSessionScheduleResponse"
          description: Malformed UUID
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Get all sessions in a recurrence
      tags:
      - Sessions
  /api/v1/sessions/recurring:
    post:
      description: |
        Generate multiple sessions for a recurring weekly pattern (e.g. Mon/Wed/Fri).
        Occurrences are filtered to exclude the past. DST transitions are handled per local timezone.
        Conflicts are detected and either failed (onConflict=FAIL) or skipped (onConflict=SKIP).
      operationId: createRecurring
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecurringSessionsRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateRecurringSessionsResponse"
          description: Sessions created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Malformed or unreadable request body
        "409":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateRecurringSessionsResponse"
          description: Conflict detected with onConflict=FAIL
        "422":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateRecurringSessionsResponse"
          description: Input validation failed
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Create recurring weekly sessions
      tags:
      - Sessions
  /api/v1/sessions/{id}:
    delete:
      description: |
        Cancel a SCHEDULED session. Cascades to:
        - All BOOKED bookings become CANCELLED with cancellationType: SESSION_CANCELLED
        - All credits are refunded to members (no late-cancel window applies for session cancellation)
        - All WAITING waitlist entries become EXPIRED
        - One notification per affected member

        Bookings already CHECKED_IN or NO_SHOW are not affected.
        Sessions that have already started but not completed can be cancelled.
      operationId: cancel
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelSessionRequest"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CancelSessionResponse"
          description: Session cancelled successfully
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CancelSessionResponse"
          description: Session not found
        "409":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CancelSessionResponse"
          description: "Conflict (e.g. session already cancelled, already completed)"
        "422":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CancelSessionResponse"
          description: Input validation failed (e.g. reason exceeds 255 characters)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Cancel a scheduled class session
      tags:
      - Sessions
    get:
      operationId: getById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClassSessionScheduleResponse"
          description: Session retrieved successfully
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClassSessionScheduleResponse"
          description: Session not found
        "422":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClassSessionScheduleResponse"
          description: Malformed UUID
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Get a session by ID
      tags:
      - Sessions
    patch:
      description: |
        Patch an existing SCHEDULED session to change its time, duration, instructor, room, or capacity.

        Only SCHEDULED sessions can be edited. Sessions that have already started, or are COMPLETED/CANCELLED cannot be modified.

        Capacity changes are validated: new capacity cannot drop below the current booked count,
        and cannot exceed the room's maximum capacity.

        When capacity is increased, waiting list members are promoted automatically (atomically within the transaction).

        When time or resources (instructor/room) change, SESSION_RESCHEDULED notifications are written for all members with active bookings.

        classTypeId is immutable and will be rejected if supplied.
      operationId: patch
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchClassSessionRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PatchClassSessionResponse"
          description: Session updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Malformed or unreadable request body
        "409":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PatchClassSessionResponse"
          description: "Conflict or state violation (e.g. capacity, time, status,\
            \ concurrency)"
        "422":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PatchClassSessionResponse"
          description: Input validation failed or unknown field supplied
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Edit a scheduled class session
      tags:
      - Sessions
