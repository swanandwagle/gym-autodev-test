            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Membership plan not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Invalid UUID format
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Retrieve a membership plan
      tags:
      - Membership Plans
    patch:
      description: "Partially updates an existing membership plan. name: optional,\
        \ must be unique case-insensitively. classCredits: tri-state behavior — omit\
        \ to leave unchanged, pass null to make the plan unlimited, pass a positive\
        \ integer to set credit count and make it credit-based. version: required,\
        \ used for optimistic locking. Request body must have only these fields; version\
        \ alone returns 422. Snapshot isolation: existing memberships snapshotted\
        \ at creation are unaffected by plan changes."
      operationId: updatePlan
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
