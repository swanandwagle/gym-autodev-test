openapi: 3.0.1
info:
  description: "REST API for managing gym class sessions, memberships, bookings and\
    \ waitlists."
  title: Fitness Class Booking System
  version: "1.0"
servers:
- description: Default server
  url: /
tags:
- description: Booking creation and management
  name: Bookings
- description: Instructor teaching schedule endpoints
  name: Instructor Schedule
- description: Membership assignment and management
  name: Memberships
- description: Member registration and management
  name: Members
- description: Credit transaction ledger and balance reconciliation
  name: Credit Ledger
- description: Booking retrieval and member history
  name: Bookings
- description: Membership plan catalogue and management
  name: Membership Plans
- description: Schedule and manage fitness class sessions
  name: Sessions
paths:
  /api/v1/bookings:
    post:
      description: "Creates a new booking for a member on a session. Returns 201 on\
        \ success, 200 on idempotent replay. Rules: suspension checked first, credits\
        \ checked before capacity. Supports optional Idempotency-Key header for safe\
        \ retries."
      operationId: createBooking
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
          description: Idempotent replay of previous successful booking (no Location
            header)
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
          description: Booking successfully created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Malformed JSON request
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Member suspended or membership inactive
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Member or session not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Conflict: session full/cancelled/started, duplicate booking,\
            \ no credits, overlapping booking, idempotency key mismatch"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Validation error or unknown field
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Create a booking
      tags:
      - Bookings
  /api/v1/bookings/{id}:
    delete:
      description: Cancels a booked spot. A successful cancellation does not imply
        available capacity because a waitlisted member may be promoted immediately.
        Credits are refunded when cancellation is at least four hours before the session.
      operationId: cancelBooking
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelBookingRequest"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CancelBookingResponse"
          description: Booking cancelled
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CancelBookingResponse"
          description: BOOKING_NOT_FOUND
        "409":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CancelBookingResponse"
          description: BOOKING_NOT_CANCELLABLE or SESSION_ALREADY_STARTED
        "422":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CancelBookingResponse"
          description: Invalid booking ID or reason exceeds 255 characters
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Cancel a booking
      tags:
      - Bookings
    get:
      description: Returns the full booking representation with session detail.
      operationId: getBooking
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookingResponse"
          description: Booking found
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookingResponse"
          description: BOOKING_NOT_FOUND
        "422":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookingResponse"
          description: Malformed UUID
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Get a booking
      tags:
      - Bookings
  /api/v1/class-types:
    get:
      operationId: list_2
      parameters:
      - description: "Sort expression: field,asc or field,desc. Available fields vary\
          \ by endpoint and are listed in each endpoint's description."
        in: query
        name: sort
        required: false
        schema:
          type: string
          example: "createdAt,desc"
      - description: "Zero-based page number (default: 0)"
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          example: 0
          minimum: 0
      - description: "Number of items per page (default: 20, max: 100)"
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          example: 20
          maximum: 100
          minimum: 1
      - in: query
        name: includeInactive
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseClassTypeResponse"
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      tags:
      - class-type-controller
    post:
      operationId: create_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassTypeRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClassTypeResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Malformed or unreadable request body
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Input validation failed
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      tags:
      - class-type-controller
  /api/v1/class-types/{id}:
    get:
      operationId: getById_3
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClassTypeResponse"
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      tags:
      - class-type-controller
    patch:
      operationId: update_2
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchClassTypeRequest"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClassTypeResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Malformed or unreadable request body
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Input validation failed
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      tags:
      - class-type-controller
  /api/v1/class-types/{id}/deactivate:
    post:
      operationId: deactivate_2
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClassTypeResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Malformed or unreadable request body
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Input validation failed
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      tags:
      - class-type-controller
  /api/v1/instructors:
    get:
      operationId: list_1
      parameters:
      - description: "Sort expression: field,asc or field,desc. Available fields vary\
          \ by endpoint and are listed in each endpoint's description."
        in: query
        name: sort
        required: false
        schema:
          type: string
          example: "createdAt,desc"
      - description: "Zero-based page number (default: 0)"
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          example: 0
          minimum: 0
      - description: "Number of items per page (default: 20, max: 100)"
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          example: 20
          maximum: 100
          minimum: 1
      - in: query
        name: includeInactive
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: specialty
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseInstructorResponse"
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      tags:
      - instructor-controller
    post:
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstructorRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InstructorResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Malformed or unreadable request body
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Input validation failed
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      tags:
      - instructor-controller
  /api/v1/instructors/{id}:
    get:
      operationId: getById_2
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InstructorResponse"
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      tags:
      - instructor-controller
    patch:
      operationId: update_1
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchInstructorRequest"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InstructorResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Malformed or unreadable request body
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Input validation failed
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      tags:
      - instructor-controller
  /api/v1/instructors/{id}/deactivate:
    post:
      operationId: deactivate_1
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InstructorResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Malformed or unreadable request body
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Input validation failed
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      tags:
      - instructor-controller
  /api/v1/instructors/{instructorId}/schedule:
    get:
      description: "Retrieve the instructor's teaching schedule for a date range.\
        \ Default window is the next 7 days. The 'to' parameter is exclusive (half-open\
        \ interval [from, to))."
      operationId: getSchedule
      parameters:
      - in: path
        name: instructorId
        required: true
        schema:
          type: string
      - description: "Range start date (inclusive), format YYYY-MM-DD. Defaults to\
          \ today."
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - description: "Range end date (exclusive), format YYYY-MM-DD. Defaults to 7\
          \ days from start. Note: unlike report endpoints, this parameter is exclusive."
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - description: "Session status filter: SCHEDULED (default), CANCELLED, or SCHEDULED,COMPLETED"
        in: query
        name: status
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseClassSessionScheduleResponse"
          description: Schedule retrieved successfully
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseClassSessionScheduleResponse"
          description: Instructor not found
        "422":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseClassSessionScheduleResponse"
          description: Invalid range or format
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Get instructor teaching schedule
      tags:
      - Instructor Schedule
  /api/v1/members:
    get:
      description: "Lists members with optional full-text search on name or email,\
        \ status filtering, and pagination. The 'q' parameter matches substring in\
        \ both directions (case-insensitive); omit or leave blank to skip filtering.\
        \ Default sort is by joinedAt descending; valid sort fields are: joinedAt,\
        \ email, fullName."
      operationId: listMembers
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: status
        required: false
        schema:
          type: string
      - description: "Sort expression: field,asc or field,desc. Available fields vary\
          \ by endpoint and are listed in each endpoint's description."
        in: query
        name: sort
        required: false
        schema:
          type: string
          example: "createdAt,desc"
      - description: "Zero-based page number (default: 0)"
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          example: 0
          minimum: 0
      - description: "Number of items per page (default: 20, max: 100)"
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          example: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse"
          description: Paginated member list returned
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Validation error (invalid pagination, sort field, or q length)"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: List and search members
      tags:
      - Members
    post:
      description: Creates a new member with the provided details. Email addresses
        are unique case-insensitively.
      operationId: registerMember
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMemberRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
          description: Member successfully created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Malformed JSON request
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Email already exists (case-insensitive)
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Validation error or unknown field
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Register a new member
      tags:
      - Members
  /api/v1/members/{id}:
    get:
      description: Retrieves the full profile of an existing member by ID.
      operationId: getMember
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
          description: Member found and returned
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Member not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Invalid UUID format
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Retrieve a member profile
      tags:
      - Members
    patch:
      description: Partially updates a member's profile with optimistic locking. Only
        the provided fields are updated; omitted fields are left unchanged. Status
        is not updatable and will be rejected as an unknown field. Version is mandatory
        and must match the current version to succeed.
      operationId: updateMember
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
          description: Member successfully updated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Malformed or unreadable request body
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Member not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Concurrent modification (stale version) or email conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Validation error (missing version, invalid format, or unknown\
            \ field)"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Update member profile
      tags:
      - Members
  /api/v1/members/{id}/reactivate:
    post:
      description: "Reactivates a suspended member, allowing transactions to resume.\
        \ Can only reactivate SUSPENDED members; reactivating an active member returns\
        \ 409."
      operationId: reactivateMember
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactivateMemberRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
          description: Member successfully reactivated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Malformed or unreadable request body
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Member not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Member is not suspended
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Input validation failed
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Reactivate a suspended member
      tags:
      - Members
  /api/v1/members/{id}/suspend:
    post:
      description: "Suspends an active member, preventing further transactions. Suspension\
        \ reason is optional and limited to 255 characters. Can only suspend ACTIVE\
        \ members; suspending an already-suspended member returns 409."
      operationId: suspendMember
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendMemberRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
          description: Member successfully suspended
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Malformed or unreadable request body
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Member not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Member already suspended
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Validation error (reason too long)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Suspend a member
      tags:
      - Members
  /api/v1/members/{memberId}/bookings:
    get:
      description: "Filters session start in the half-open interval [from,to). upcomingOnly\
        \ selects future BOOKED bookings and cannot be combined with status."
      operationId: history
      parameters:
      - in: path
        name: memberId
        required: true
        schema:
          type: string
      - in: query
        name: status
        required: false
        schema:
          type: string
      - in: query
        name: from
        required: false
        schema:
          type: string
      - in: query
        name: to
        required: false
        schema:
          type: string
      - in: query
        name: upcomingOnly
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - description: Unsupported for member booking history
        in: query
        name: sort
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseBookingResponse"
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: List a member's bookings
      tags:
      - Bookings
  /api/v1/members/{memberId}/memberships:
    get:
      description: "Retrieves all memberships for a member, ordered by startsAt descending.\
        \ Returns effective status for each membership. Optional status filter can\
        \ be provided as comma-separated values (e.g., ?status=EXPIRED,CANCELLED).\
        \ Sort parameter is not supported and will return 422 if provided."
      operationId: getMemberHistory
      parameters:
      - in: path
        name: memberId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        required: false
        schema:
          type: string
      - in: query
        name: sort
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipListResponse"
          description: Member's membership history retrieved successfully
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Member not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Validation error (e.g., sort parameter provided or invalid\
            \ UUID format)"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: List member's membership history
      tags:
      - Memberships
    post:
      description: "Assigns a membership plan to a member, computing the expiry based\
        \ on plan duration. startsAt defaults to now (if no active membership) or\
        \ to the active membership's expiresAt. A member can have at most one ACTIVE\
        \ and one PENDING membership. startsAt must not be more than 5 minutes in\
        \ the past. Credits are snapshotted from the plan at assignment time; plan\
        \ changes do not affect existing memberships."
      operationId: assignMembership
      parameters:
      - in: path
        name: memberId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignMembershipRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
          description: Membership successfully assigned
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Malformed or unreadable request body
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Member or plan not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Conflict: plan inactive, member already has queued memberships,\
            \ or startsAt before current expiry"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Validation error: invalid UUID format or startsAt too far\
            \ in the past"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Assign a membership plan to a member
      tags:
      - Memberships
  /api/v1/members/{memberId}/memberships/{membershipId}:
    get:
      description: "Retrieves a single membership by its ID. Returns effective status\
        \ (e.g., ACTIVE→EXPIRED when expiry has passed, PENDING→ACTIVE when start\
        \ time has passed). The stored row is not modified."
      operationId: getMembership
      parameters:
      - in: path
        name: memberId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: membershipId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
          description: Membership retrieved successfully
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Membership not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Invalid membership ID format
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Retrieve a membership by ID
      tags:
      - Memberships
  /api/v1/members/{memberId}/memberships/{membershipId}/cancel:
    delete:
      description: "Cancels a membership that is in PENDING status. Only PENDING memberships\
        \ can be cancelled; ACTIVE, EXPIRED, or CANCELLED memberships will be rejected\
        \ with 409. Cancellation is not reversible and does not restore credits. After\
        \ cancellation, the member can be assigned a new membership without triggering\
        \ MEMBERSHIP_ALREADY_QUEUED conflict."
      operationId: cancelMembership
      parameters:
      - in: path
        name: memberId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: membershipId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResponse"
          description: Membership successfully cancelled
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Membership not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Membership is not in PENDING status and cannot be cancelled
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Invalid membership ID format
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Cancel a PENDING membership
      tags:
      - Memberships
  /api/v1/membership-plans:
    get:
      description: "Lists membership plans with optional filtering and pagination.\
        \ By default, only active plans are returned; pass includeInactive=true to\
        \ include inactive. unlimited=true filters to unlimited-credits plans only\
        \ (classCredits is null). tier=BASIC|PREMIUM|VIP filters by plan tier. Note:\
        \ when sorting by price, results are ordered by amount and then by currency\
        \ (lexicographically). Valid sort fields: name, durationDays, price (amount),\
        \ tier, createdAt, updatedAt. Default sort is by createdAt descending."
      operationId: listPlans
      parameters:
      - in: query
        name: includeInactive
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: unlimited
        required: false
        schema:
          type: boolean
      - in: query
        name: tier
        required: false
        schema:
          type: string
      - description: "Sort expression: field,asc or field,desc. Available fields vary\
          \ by endpoint and are listed in each endpoint's description."
        in: query
        name: sort
        required: false
        schema:
          type: string
          example: "createdAt,desc"
      - description: "Zero-based page number (default: 0)"
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          example: 0
          minimum: 0
      - description: "Number of items per page (default: 20, max: 100)"
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          example: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse"
          description: Paginated membership plan list returned
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Validation error (invalid pagination, sort field, or enum\
            \ value)"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: List membership plans
      tags:
      - Membership Plans
    post:
      description: "Creates a new membership plan. Name must be unique (case-insensitive).\
        \ classCredits is optional: omit or pass null for unlimited plans. durationDays\
        \ must be between 1 and 3660. price.amount is required and must have at most\
        \ 2 decimal places. price.currency must be uppercase 3-letter ISO 4217 code.\
        \ tier defaults to BASIC if omitted."
      operationId: createPlan
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMembershipPlanRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPlanResponse"
          description: Membership plan successfully created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Malformed JSON request
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Plan name already exists (case-insensitive)
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Validation error (invalid price format, out-of-range values,\
            \ or unknown field)"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Create a new membership plan
      tags:
      - Membership Plans
  /api/v1/membership-plans/{id}:
    delete:
      description: "Deactivates an active membership plan. Once deactivated, the plan\
        \ is no longer available for new memberships but existing memberships remain\
        \ valid and functional for bookings. Deactivated plans do not appear in the\
        \ default list (includeInactive=false)."
