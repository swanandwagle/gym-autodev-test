          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPlanResponse"
          description: Membership plan successfully updated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Malformed or unreadable request body
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Membership plan not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Conflict: stale version, name already exists, or plan inactive"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: "Validation error (invalid format, missing version, only version\
            \ in body, etc.)"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal server error
      summary: Update a membership plan
      tags:
      - Membership Plans
