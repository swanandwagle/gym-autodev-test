# Error message templates for the Fitness Class Booking System.
# Keys are ErrorCode enum names. A wording change here requires no recompilation.

MALFORMED_REQUEST=Request body could not be read or is malformed JSON.
NOT_PERMITTED=The requested action is not permitted.
MEMBER_SUSPENDED=The member account is suspended and cannot perform this action.
MEMBER_INACTIVE=The member account is inactive and cannot perform this action.
NOT_FOUND=The requested resource was not found.
MEMBER_NOT_FOUND=No member found with the given identifier.
MEMBERSHIP_PLAN_NOT_FOUND=No membership plan found with the given identifier.
MEMBERSHIP_NOT_FOUND=No membership found with the given identifier.
CLASS_TYPE_NOT_FOUND=No class type found with the given identifier.
INSTRUCTOR_NOT_FOUND=No instructor found with the given identifier.
ROOM_NOT_FOUND=No room found with the given identifier.
SESSION_NOT_FOUND=No class session found with the given identifier.
BOOKING_NOT_FOUND=No booking found with the given identifier.
WAITLIST_ENTRY_NOT_FOUND=No waitlist entry found for the given identifier.
CONFLICT=The request conflicts with the current state.
CONCURRENT_MODIFICATION=The resource was modified concurrently. Please re-fetch and retry.
DUPLICATE_BOOKING=A non-cancelled booking already exists for this member and session.
SESSION_FULL=The session has no remaining capacity.
SESSION_CANCELLED=The session has been cancelled and cannot be booked.
SESSION_NOT_BOOKABLE=The session is not open for booking.
BOOKING_ALREADY_CANCELLED=The booking has already been cancelled.
BOOKING_ALREADY_CHECKED_IN=The booking has already been checked in.
CHECK_IN_WINDOW_NOT_OPEN=The check-in window for this session is not currently open.
WAITLIST_ALREADY_JOINED=The member is already on the waitlist for this session.
WAITLIST_ALREADY_PROCESSED=The waitlist entry has already been processed or expired.
MEMBERSHIP_ALREADY_ACTIVE=The member already has an active membership.
CREDITS_INSUFFICIENT=The membership does not have enough credits for this operation.
OVERLAPPING_BOOKING=This session overlaps with an existing confirmed booking for the member.
LATE_CANCEL_NO_REFUND=Cancellation is past the refund window; no credit refund will be issued.
INSTRUCTOR_SCHEDULE_CONFLICT=The instructor already has a session scheduled in this time slot.
ROOM_SCHEDULE_CONFLICT=The room is already occupied in the requested time slot.
IDEMPOTENCY_KEY_CONFLICT=The idempotency key was previously used with different request parameters.
JOB_ALREADY_RUNNING=The scheduled job is already running.
VALIDATION_FAILED=Request validation failed. See errors.
INVALID_DATE_RANGE=The supplied date or time range is logically invalid.
INVALID_PAGINATION=Pagination parameters are outside the allowed bounds.
INVALID_SORT_FIELD=The requested sort field is not supported by this endpoint.
UNKNOWN_FIELD=The request body contains an unrecognised field.
INTERNAL_ERROR=An unexpected error occurred.
